<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060b15">
  <meta name="description" content="灵感画廊 — 收集 AI 提示词、视频和视觉参考的个人灵感库">
  <title>灵感画廊 · Prompt Gallery</title>
  <link rel="icon" type="image/svg+xml" href="./public/favicon.svg">
</head>
<body>
  <a class="skip-link" href="#archive">跳到画廊</a>

  <!-- 流体动画背景 -->
  <div class="ocean-background" data-state="loading">
    <canvas id="gloria-ocean"></canvas>
    <div class="ocean-veil"></div>
  </div>

  <!-- 顶部导航 -->
  <header class="site-header">
    <a class="brand" href="#top">
      <span class="brand-mark">✦</span>
      <span>灵感画廊</span>
    </a>
    <button class="lang-toggle" id="lang-toggle" type="button">EN</button>
  </header>

  <main id="top">
    <!-- Hero 区 -->
    <section class="hero" id="hero">
      <div class="hero-heading">
        <h1 id="hero-title">灵感画廊</h1>
      </div>
      <div class="hero-invitation">
        <p id="hero-poem">收集每一次灵感的闪光，<br>让它们在数字的海洋里生长。</p>
        <a class="enter-archive" href="#archive">
          <span data-i18n="hero.enter">浏览灵感</span>
          <span class="arrow-down">↓</span>
        </a>
        <p class="hero-count" id="hero-count">加载中…</p>
      </div>
    </section>

    <!-- 画廊区 -->
    <section id="archive" class="archive">
      <div class="archive-heading">
        <div>
          <p class="eyebrow">A COLLECTION OF POSSIBILITIES</p>
          <h2 id="archive-title">影像灵感库 <span id="total-count"></span></h2>
          <p class="archive-intro" data-i18n="archive.intro">让片刻的灵感，有处可寻。</p>
        </div>
        <p class="updated-at" id="updated-at"></p>
      </div>

      <!-- 搜索和筛选栏 -->
      <div class="filter-panel">
        <div class="filter-top">
          <label class="search-box">
            <span class="search-icon">⌕</span>
            <input id="search" type="search" placeholder="搜索作品、提示词、风格…" autocomplete="off">
          </label>
          <button id="open-filters" class="filter-trigger">
            <span>⚙</span>
            <span data-i18n="filter.open">筛选</span>
          </button>
        </div>
        <div class="filter-summary">
          <span id="result-count" class="result-count"></span>
          <button id="reset-filters" class="quiet-button" hidden>✕ <span data-i18n="filter.clear">清除</span></button>
        </div>
      </div>

      <!-- 错误状态 -->
      <div id="catalog-error" class="empty-state" hidden>
        <p>暂时没能读取灵感库。</p>
        <button id="retry-catalog">重新加载</button>
      </div>

      <!-- 空状态 -->
      <div id="empty-state" class="empty-state" hidden>
        <span class="sparkle">✦</span>
        <h3>灵感还在别处</h3>
        <p>换个关键词，或清除筛选再看看。</p>
        <button id="empty-reset">查看全部作品</button>
      </div>

      <!-- 画廊瀑布流 -->
      <div class="gallery" id="gallery"></div>

      <!-- 加载更多 -->
      <div class="load-more-area" id="load-more-area" hidden>
        <button class="load-more" id="load-more">加载更多 ↓</button>
      </div>
    </section>
  </main>

  <!-- 底部 -->
  <footer class="site-footer">
    <a href="#top">灵感画廊 <span>BY YOU</span></a>
    <p>灵感不死，只是换了个地方生长。</p>
  </footer>

  <!-- 筛选弹窗 -->
  <dialog id="filter-dialog">
    <div class="filter-sheet-header">
      <h2>筛选作品</h2>
      <button id="close-filters" aria-label="关闭">✕</button>
    </div>
    <div class="filter-sheet-body">
      <label>
        <span>模型</span>
        <select id="model-filter">
          <option value="">全部模型</option>
        </select>
      </label>
      <label>
        <span>来源</span>
        <select id="source-filter">
          <option value="">全部来源</option>
        </select>
      </label>
      <label>
        <span>生成方式</span>
        <select id="method-filter">
          <option value="">全部方式</option>
        </select>
      </label>
      <section>
        <h3>风格标签</h3>
        <div class="tag-filters" id="tag-filters"></div>
      </section>
    </div>
    <div class="filter-sheet-footer">
      <button id="reset-filter-draft">重置</button>
      <button id="apply-filters">应用筛选</button>
    </div>
  </dialog>

  <!-- 作品详情弹窗 -->
  <dialog id="work-dialog">
    <div class="dialog-toolbar">
      <span id="work-position"></span>
      <button id="close-work" aria-label="关闭">✕</button>
    </div>
    <div class="work-layout">
      <div class="work-media">
        <div class="video-surface">
          <video id="work-video" controls playsinline preload="none"></video>
        </div>
        <img id="work-image" hidden alt="">
        <p id="media-caption"></p>
      </div>
      <div class="work-info">
        <h2 id="work-title"></h2>
        <p id="work-credit"></p>
        <div class="work-tags" id="work-tags"></div>
        <section class="prompt-section">
          <div class="section-title">
            <h3 id="prompt-title">提示词</h3>
            <button id="copy-prompt">📋 复制</button>
          </div>
          <div class="prompt-text" id="prompt-text"></div>
        </section>
        <div class="work-actions">
          <a id="source-link" target="_blank" rel="noopener noreferrer">查看原始来源 ↗</a>
          <button id="share-work">🔗 复制链接</button>
        </div>
      </div>
    </div>
  </dialog>

  <!-- 回到顶部 -->
  <button class="back-to-top" id="back-to-top" aria-label="回到顶部">↑</button>

  <!-- Toast 提示 -->
  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
